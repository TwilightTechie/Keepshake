# Keepsake P0 bench firmware: VAD-gated PDM capture -> BLE notifications.
# PCM16 @ 16 kHz for the bench (FW-2's Opus lands in P1; see firmware/README.md).

# --- Audio (PDM mic via dmic API) ---
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Keepsake-P0"
# P0 bench: no pairing yet; FW-8 (LE Secure Connections) arrives with P1
CONFIG_BT_SMP=n
# Throughput: 2M PHY + data length extension + big MTU
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_CONN_TX_MAX=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=16

# --- System ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
